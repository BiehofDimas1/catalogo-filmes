<h1>Catálogo de Filmes</h1>

@if (mensagem()) {
  <p class="aviso" [class.erro]="erro()">{{ mensagem() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Título</th>
      <th>Duração</th>
      <th>Licenças</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    @for (f of filmes(); track f.id) {
      <tr>
        <td>{{ f.titulo }}</td>
        <td>{{ f.duracaoMinutos }} min</td>
        <td>{{ f.licencasDisponiveis }}</td>
        <td>{{ f.ativo ? 'Ativo' : 'Inativo' }}</td>
        <td>
          @if (f.ativo) {
            <button (click)="inativar(f)">Inativar</button>
          }
        </td>
      </tr>
    } @empty {
      <tr><td colspan="5">Nenhum filme cadastrado.</td></tr>
    }
  </tbody>
</table>
