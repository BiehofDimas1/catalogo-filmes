# Perfil usado pelos testes: banco em memória isolado por contexto e chave JWT fixa.
spring.datasource.url=jdbc:h2:mem:filmes-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
jwt.secret=segredo-somente-para-testes-com-mais-de-32-bytes
# A rotina de expiração é testada diretamente no service.
aluguel.expiracao-intervalo=PT1H
