spring.application.name=filmes-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/filmesdb}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:}
jwt.validade=2h

aluguel.valor=9.90
aluguel.duracao=48h
aluguel.prazo-cancelamento=1h
aluguel.limite-ativos=5
aluguel.expiracao-intervalo=PT1M

pagamento.simulado.resultado=${PAGAMENTO_SIMULADO:APROVADO}

app.cors.origens=http://localhost:4200
