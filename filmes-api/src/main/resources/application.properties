spring.application.name=filmes-api
server.port=8080

# Banco H2 em arquivo: os dados (inclusive o ADMIN) sobrevivem aos reinicios.
# A pasta data/ fica fora do git. Para recomecar do zero, pare a API e apague a pasta.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/filmesdb}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2, somente para uso local: http://localhost:8080/h2-console
# E por ele que o primeiro ADMIN e promovido (passo a passo no README).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: defina JWT_SECRET (pelo menos 32 bytes) para os tokens sobreviverem a reinicios.
# Sem ele, a API gera uma chave aleatoria a cada inicio.
jwt.secret=${JWT_SECRET:}
jwt.validade=2h

# Regras do aluguel (fluxo principal)
aluguel.valor=9.90
aluguel.duracao=48h
aluguel.prazo-cancelamento=1h
aluguel.limite-ativos=5
# Intervalo da rotina que expira alugueis vencidos e devolve as licencas
aluguel.expiracao-intervalo=PT1M

# Pagamento simulado: APROVADO ou RECUSADO. So o servidor escolhe o resultado.
pagamento.simulado.resultado=${PAGAMENTO_SIMULADO:APROVADO}

# Origens liberadas para o frontend Angular
app.cors.origens=http://localhost:4200
